name: offline-packs

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Use the fixture area and skip AREAS_URL"
        type: boolean
        default: false
  repository_dispatch:
    types: [areas-changed]

concurrency:
  group: offline-packs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offline-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AREAS_URL: ${{ secrets.AREAS_URL }}
      AREAS_TOKEN: ${{ secrets.AREAS_TOKEN }}
      TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true' }}
      RUN_TIMEOUT_S: "3600"
    steps:
      - uses: actions/checkout@v4

      - name: Install pack dependencies
        run: pip install "pmtiles==3.8.1" shapely

      - name: Resolve areas
        id: areas
        env:
          AREAS_FILE: ${{ runner.temp }}/areas.json
        run: python3 scripts/offline_packs.py resolve

      - name: Build offline packs and upload
        if: steps.areas.outputs.has_areas == 'true'
        env:
          AREAS_FILE: ${{ runner.temp }}/areas.json
        run: python3 scripts/offline_packs.py run
