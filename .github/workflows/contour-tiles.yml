name: contour-tiles

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      test:
        description: "Use the fixture area and skip AREAS_URL"
        type: boolean
        default: false
  repository_dispatch:
    types: [areas-changed]

concurrency:
  group: contour-tiles
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contour-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AREAS_URL: ${{ secrets.AREAS_URL }}
      AREAS_TOKEN: ${{ secrets.AREAS_TOKEN }}
      MISSES_URL: ${{ secrets.MISSES_URL }}
      TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve areas
        id: areas
        env:
          AREAS_FILE: ${{ runner.temp }}/areas.json
        run: python3 scripts/contour_tiles.py resolve

      - name: Prebuild contour tiles and upload
        if: steps.areas.outputs.has_areas == 'true'
        env:
          AREAS_FILE: ${{ runner.temp }}/areas.json
        run: python3 scripts/contour_tiles.py run
